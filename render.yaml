services:
  - type: web
    name: dankali
    runtime: docker
    plan: starter
    disk:
      name: dankali-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: WHATSAPP
        sync: false
      - key: PAYMENTS
        sync: false
      - key: PROVIDER_MODE
        value: manual
      - key: WEBHOOK_SECRET
        sync: false
